name: Browser prototype and server tests

on:
  push:
    branches: [main, feat/blender-unreal-cloud-pipeline]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astrea
          POSTGRES_PASSWORD: astrea_test
          POSTGRES_DB: astrea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astrea -d astrea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://astrea:astrea_test@localhost:5432/astrea_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run server and gameplay unit tests
        run: npm test
      - name: Verify PostgreSQL backup and restore
        run: bash scripts/test-postgres-backup-restore.sh
      - name: Benchmark two-client WebSocket loopback
        run: npm run benchmark:realtime
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop browser prototype
        run: npm run test:browser
