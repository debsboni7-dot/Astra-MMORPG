name: ASTREA Unity foundation checks

on:
  push:
    branches: [feat/blender-unreal-cloud-pipeline, spike/fishnet-unity-6-3-evaluation]
    paths:
      - "unity/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/meshy-import-existing-artifact.yml"
      - "tests/fishnet-compile-stubs/**"
  pull_request:
    branches: [main]
    paths:
      - "unity/**"
      - ".github/workflows/unity-foundation-check.yml"
      - "tests/fishnet-compile-stubs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-unity-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "Valid YAML: #{path}" }' .github/workflows/*.yml
      - name: Verify FishNet 4.7.4 source API used by ASTREA
        run: |
          git clone --depth 1 --branch 4.7.4 https://github.com/FirstGearGames/FishNet.git /tmp/fishnet
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/fishnet/Assets/FishNet")
          package = json.loads((root / "package.json").read_text())
          assert package["version"] == "4.7.4", package

          authenticator = (root / "Runtime/Authenticating/Authenticator.cs").read_text(encoding="utf-8-sig")
          server_broadcast = (root / "Runtime/Managing/Server/ServerManager.Broadcast.cs").read_text(encoding="utf-8-sig")
          server_qol = (root / "Runtime/Managing/Server/ServerManager.QOL.cs").read_text(encoding="utf-8-sig")
          client_broadcast = (root / "Runtime/Managing/Client/ClientManager.Broadcast.cs").read_text(encoding="utf-8-sig")
          client_manager = (root / "Runtime/Managing/Client/ClientManager.cs").read_text(encoding="utf-8-sig")
          network_object = (root / "Runtime/Object/NetworkObject/NetworkObject.cs").read_text(encoding="utf-8-sig")
          network_object_serialized = (root / "Runtime/Object/NetworkObject/NetworkObject.Serialized.cs").read_text(encoding="utf-8-sig")
          single_prefabs = (root / "Runtime/Managing/Object/PrefabObjects/SinglePrefabObjects.cs").read_text(encoding="utf-8-sig")
          network_transform = (root / "Runtime/Generated/Component/NetworkTransform/NetworkTransform.cs").read_text(encoding="utf-8-sig")
          network_behaviour_qol = (root / "Runtime/Object/NetworkBehaviour/NetworkBehaviour.QOL.cs").read_text(encoding="utf-8-sig")
          rpc_attributes = (root / "Runtime/Object/NetworkBehaviour/Attributes.cs").read_text(encoding="utf-8-sig")
          server_manager = (root / "Runtime/Managing/Server/ServerManager.cs").read_text(encoding="utf-8-sig")
          tugboat = (root / "Runtime/Transporting/Transports/Tugboat/Tugboat.cs").read_text(encoding="utf-8-sig")
          manager_prefab = (root / "Demos/Prefabs/NetworkManager.prefab").read_text(encoding="utf-8-sig")
          transport_manager = (root / "Runtime/Managing/Transporting/TransportManager.cs").read_text(encoding="utf-8-sig")
          network_manager_source = (root / "Runtime/Managing/NetworkManager.cs").read_text(encoding="utf-8-sig")

          assert "public abstract event Action<NetworkConnection, bool> OnAuthenticationResult;" in authenticator
          assert "public virtual void OnRemoteConnection(NetworkConnection connection)" in authenticator
          assert "RegisterBroadcast<T>(Action<NetworkConnection, T, Channel> handler, bool requireAuthentication = true)" in server_broadcast
          assert "UnregisterBroadcast<T>(Action<NetworkConnection, T, Channel> handler)" in server_broadcast
          assert "Broadcast<T>(NetworkConnection connection, T message, bool requireAuthenticated = true, Channel channel = Channel.Reliable)" in server_broadcast
          assert "RegisterBroadcast<T>(Action<T, Channel> handler)" in client_broadcast
          assert "UnregisterBroadcast<T>(Action<T, Channel> handler)" in client_broadcast
          assert "Broadcast<T>(T message, Channel channel = Channel.Reliable)" in client_broadcast
          assert "Spawn(NetworkObject nob, NetworkConnection ownerConnection = null" in server_qol
          assert "public event Action OnAuthenticated;" in client_manager
          assert "StartConnection(string address, ushort port)" in client_manager
          assert "SetIsSpawnable(bool value)" in network_object
          assert "SetAssetPathHash(ulong value)" in network_object_serialized
          assert "AddObject(NetworkObject networkObject" in single_prefabs
          assert "private bool _clientAuthoritative = true;" in network_transform
          assert "public bool IsOwner => _networkObjectCache.IsOwner;" in network_behaviour_qol
          assert "public class ServerRpcAttribute : RpcAttribute" in rpc_attributes
          assert "private bool _startOnHeadless = true;" in server_manager
          assert "private ushort _port = 7770;" in tugboat
          assert "public Transport Transport;" in transport_manager
          assert "public TransportManager TransportManager { get; private set; }" in network_manager_source
          assert "TransportManager = GetOrCreateComponent<TransportManager>()" in network_manager_source
          assert "_spawnablePrefabs" in manager_prefab
          assert (root / "Demos/Prefabs/NetworkManager.prefab").is_file()
          print("FishNet 4.7.4 package version, authenticator, broadcasts and server spawn API verified.")
          PY
      - name: Verify FishyUnityTransport DTLS source API
        run: |
          git clone --depth 1 --branch 2.0.0-pre.2 https://github.com/ooonush/FishyUnityTransport.git /tmp/fishy-utp
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/fishy-utp/Assets/FishNet/Plugins/FishyUnityTransport")
          package = json.loads((root / "package.json").read_text())
          assert package["version"] == "2.0.0-pre.2", package
          assert package["dependencies"]["com.unity.transport"] == "1.3.1", package
          asmdef = json.loads((root / "FishyUnityTransport.asmdef").read_text())
          assert any(
              item["name"] == "com.unity.transport"
              and item["expression"] == "2.0.0-exp"
              and item["define"] == "UTP_TRANSPORT_2_0_ABOVE"
              for item in asmdef["versionDefines"]
          ), asmdef
          source = (root / "UnityTransport.cs").read_text()
          for contract in ["public bool UseEncryption", "SetServerSecrets(", "SetClientSecrets(", "SetConnectionData(string ipv4Address, ushort port, string listenAddress = null)", "WithSecureServerParameters(", "WithSecureClientParameters("]:
              assert contract in source, contract
          assert "DTLS for UDP" in source
          assert "m_UseEncryption = false" in source, "Encryption is opt-in and must be explicitly enabled."
          assert (root / "LICENSE").read_text().startswith("MIT License")
          print("FishyUnityTransport 2.0.0-pre.2 DTLS API and MIT license verified.")
          PY
      - name: Compile ASTREA FishNet source against isolated API stubs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate and verify ephemeral DTLS certificate chain
        run: bash scripts/generate-fishnet-dtls-test-certs.sh --verify-only

      - name: Compile ASTREA networking sources and run API URL contract tests
        run: dotnet run --project tests/fishnet-compile-stubs/FishNetCompileStubs.csproj --configuration Release

      - name: Validate Unity project metadata and zero-billing package policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("unity")
          manifest = json.loads((root / "Packages/manifest.json").read_text())
          deps = manifest["dependencies"]
          assert deps.get("com.unity.render-pipelines.universal") == "17.3.0", deps
          assert deps.get("com.unity.ugui") == "2.0.0", deps
          assert deps.get("com.unity.animation.rigging") == "1.4.1", deps
          assert deps.get("com.unity.inputsystem") == "1.20.1", deps
          assert deps.get("com.unity.cinemachine") == "3.1.7", deps
          assert deps.get("com.unity.addressables") == "2.10.3", deps
          if "spike/fishnet-unity-6-3-evaluation" in __import__("os").environ.get("GITHUB_REF", ""):
              assert deps.get("com.firstgeargames.fishnet") == "https://github.com/FirstGearGames/FishNet.git?path=Assets/FishNet#4.7.4", deps
              assert deps.get("com.unity.nuget.newtonsoft-json") == "3.2.1", deps
              assert deps.get("com.unity.transport") == "2.7.5", deps
              assert deps.get("com.alven.fishnet.unitytransport") == "https://github.com/ooonush/FishyUnityTransport.git?path=Assets/FishNet/Plugins/FishyUnityTransport#2.0.0-pre.2", deps
          assert not any(name.startswith("com.unity.services.") for name in deps), deps

          version = (root / "ProjectSettings/ProjectVersion.txt").read_text()
          assert "6000.3.28f1" in version, version

          required = [
              "Assets/Scripts/Networking/AstreaApiClient.cs",
              "Assets/Scripts/Networking/AstreaFishNetAuthenticator.cs",
              "Assets/Scripts/Networking/AstreaFishNetTransportSecurity.cs",
              "Assets/Scripts/Networking/AstreaFishNetPlayerSpawner.cs",
              "Assets/Scripts/Networking/AstreaFishNetNetworkTestPlayer.cs",
              "Assets/Scripts/Networking/AstreaFishNetNetworkTestClient.cs",
              "Assets/Editor/AstreaFishNetPrototypeSceneBuilder.cs",
              "Assets/Scripts/Armor/AstreaArmorSlot.cs",
              "Assets/Scripts/Combat/AstreaCombatController.cs",
              "Assets/Scripts/Combat/AstreaHealth.cs",
              "Assets/Scripts/Combat/AstreaSpellCombatController.cs",
              "Assets/Scripts/Character/AstreaThirdPersonController.cs",
              "Assets/Scripts/Input/AstreaInputRouter.cs",
              "Assets/Scripts/Content/AstreaAddressableLoader.cs",
              "Assets/Scripts/VFX/AstreaVfxLibrary.cs",
              "Assets/Scripts/VFX/AstreaSpellVfxController.cs",
              "Assets/Scripts/Animation/AstreaAnimationDriver.cs",
              "Assets/Editor/AstreaVfxSetup.cs",
              "Assets/Editor/AstreaAnimatorSetup.cs",
              "Assets/Editor/AstreaCloudBuild.cs",
              "Assets/Scripts/UI/AstreaVirtualJoystick.cs",
              "Assets/Scripts/UI/AstreaTouchLookArea.cs",
              "Assets/Scripts/UI/AstreaMobileInputBinder.cs",
              "Assets/Scripts/UI/AstreaHoldButton.cs",
              "Assets/Scripts/Rendering/AstreaGraphicsProfile.cs",
              "Assets/Editor/AstreaUrpSetup.cs",
              "Assets/Editor/AstreaArmorModelPostprocessor.cs",
              "Assets/Editor/AstreaStarterSceneBuilder.cs",
              "Assets/Editor/AstreaMixamoImportPostprocessor.cs",
              "Assets/Art/Animations/Mixamo/README.md",
              "Assets/Art/Environment/Astrea/ASTREA_Starter_Plains.fbx",
              "README.md",
          ]
          for relative in required:
              path = root / relative
              assert path.is_file() and path.stat().st_size > 0, relative

          security_meta = root / "Assets/Scripts/Networking/AstreaFishNetTransportSecurity.cs.meta"
          assert security_meta.is_file(), "DTLS component requires a stable Unity meta file"
          assert "c41a4e80f1e84f9ba3b55d7c1b6a2f90" in security_meta.read_text()

          for path in root.rglob("*.cs"):
              source = path.read_text()
              assert source.count("{") == source.count("}"), f"Unbalanced braces: {path}"

          fishnet_auth = (root / "Assets/Scripts/Networking/AstreaFishNetAuthenticator.cs").read_text()
          assert ": Authenticator" in fishnet_auth
          assert "RegisterBroadcast<AstreaJoinTicketBroadcast>(OnJoinTicketBroadcast, false)" in fishnet_auth
          assert "REALTIME_SERVER_SECRET" in fishnet_auth
          assert "/v1/internal/realtime/fishnet/consume" in fishnet_auth
          assert "SetClientTicket" in fishnet_auth
          assert "WaitForSecondsRealtime(10f)" in fishnet_auth
          assert "request.timeout = 5" in fishnet_auth
          assert "internal static bool IsAllowedApiUrl" in fishnet_auth
          assert "uri.Scheme != Uri.UriSchemeHttp" in fishnet_auth
          assert "uri.UserInfo" in fishnet_auth
          assert "uri.Query" in fishnet_auth
          assert "uri.Fragment" in fishnet_auth
          assert "IPAddress.IsLoopback" in fishnet_auth

          transport_security = (root / "Assets/Scripts/Networking/AstreaFishNetTransportSecurity.cs").read_text()
          for contract in ["UseEncryption", "SetServerSecrets", "SetClientSecrets", "ASTREA_DTLS_SERVER_CERT", "ASTREA_DTLS_SERVER_KEY", "ASTREA_DTLS_SERVER_NAME"]:
              assert contract in transport_security, contract
          assert "ASTREA_NETWORK_ROLE" in transport_security
          assert "must be server or client when supplied" in transport_security
          assert "privateKey" in transport_security
          assert "Debug.Log" not in transport_security, "DTLS private material must never be logged"
          fishnet_test_player = (root / "Assets/Scripts/Networking/AstreaFishNetNetworkTestPlayer.cs").read_text()
          assert "[ServerRpc]" in fishnet_test_player and "Vector2.ClampMagnitude" in fishnet_test_player
          fishnet_test_client = (root / "Assets/Scripts/Networking/AstreaFishNetNetworkTestClient.cs").read_text()
          assert "ASTREA_TEST_JOIN_TICKET" in fishnet_test_client
          assert "OnAuthenticated" in fishnet_test_client
          assert "REMOTE_MOVEMENT_NOT_REPLICATED" in fishnet_test_client
          fishnet_scene_builder = (root / "Assets/Editor/AstreaFishNetPrototypeSceneBuilder.cs").read_text()
          assert "ASTREA_FishNet_NetworkTest.unity" in fishnet_scene_builder
          assert "clientAuthority.boolValue = false" in fishnet_scene_builder
          assert "SinglePrefabObjects" in fishnet_scene_builder
          assert "FishyUnityTransport" in fishnet_scene_builder
          assert "SetConnectionData" in fishnet_scene_builder
          assert "(ushort)7770" in fishnet_scene_builder
          assert "using FishNet.Managing.Transporting;" in fishnet_scene_builder
          assert "GetComponent<TransportManager>()" in fishnet_scene_builder
          assert "transportManager.Transport = unityTransport" in fishnet_scene_builder
          assert "using System.Reflection;" in fishnet_scene_builder
          assert "networkManager.TransportManager" not in fishnet_scene_builder, "TransportManager is created during NetworkManager initialization, not in the editor prefab instance"
          assert "AstreaFishNetTransportSecurity" in fishnet_scene_builder

          fishnet_spawner = (root / "Assets/Scripts/Networking/AstreaFishNetPlayerSpawner.cs").read_text()
          assert "OnClientIdentityAuthenticated" in fishnet_spawner
          assert "TrySubscribeServerState" in fishnet_spawner
          assert "private void Start()" in fishnet_spawner
          assert "serverStateSubscribed" in fishnet_spawner
          assert "connection.IsAuthenticated" in fishnet_spawner
          assert "ServerManager.Spawn(player, connection)" in fishnet_spawner
          assert "AstreaServerPlayerIdentity" in fishnet_spawner

          cloud_build = (root / "Assets/Editor/AstreaCloudBuild.cs").read_text()
          assert "BuildLinuxDedicatedServer" in cloud_build
          assert "BuildTarget.StandaloneLinux64" in cloud_build
          assert "StandaloneBuildSubtarget.Server" in cloud_build
          assert "BuildFishNetNetworkTestBinaries" in cloud_build
          assert "StandaloneBuildSubtarget.Player" in cloud_build
          assert (root.parent / ".github/workflows/unity-linux-server-build.yml").is_file()
          assert (root.parent / ".github/workflows/unity-fishnet-two-client-integration.yml").is_file()
          assert (root.parent / "scripts/apply-server-migrations.js").is_file()
          assert (root.parent / "scripts/prepare-fishnet-integration-test.js").is_file()
          assert (root.parent / "scripts/generate-fishnet-dtls-test-certs.sh").is_file()
          assert "openssl verify" in (root.parent / "scripts/generate-fishnet-dtls-test-certs.sh").read_text()

          api_client = (root / "Assets/Scripts/Networking/AstreaApiClient.cs").read_text()
          assert "IsAllowedApiBaseUrl(value)" in api_client
          assert "internal static bool IsAllowedApiBaseUrl" in api_client
          assert "uri.Scheme != Uri.UriSchemeHttp" in api_client
          assert "IPAddress.IsLoopback" in api_client
          assert "if (!IsAllowedApiBaseUrl(baseUrl))" in api_client
          assert "RequestFishNetJoinTicket" in api_client
          assert "request.timeout = 10" in api_client
          assert "/v1/realtime/fishnet/tickets" in api_client

          combat = (root / "Assets/Scripts/Combat/AstreaCombatController.cs").read_text()
          input_router = (root / "Assets/Scripts/Input/AstreaInputRouter.cs").read_text()
          scene_builder = (root / "Assets/Editor/AstreaStarterSceneBuilder.cs").read_text()
          spell_combat = (root / "Assets/Scripts/Combat/AstreaSpellCombatController.cs").read_text()
          for school in ["fire", "water", "wind", "earth", "ice", "lightning", "nature", "light", "dark"]:
              assert 'element = "' + school + '"' in spell_combat, school
          assert "manaCost" in spell_combat and "cooldown" in spell_combat
          assert "ReceiveDamage" in spell_combat and "ApplyShield" in spell_combat
          cast_method = spell_combat.split("public bool TryCast(string element)", 1)[1].split("private void CommitCast", 1)[0]
          assert "if (!hitAny) return false;" in cast_method
          assert "CommitCast(spell);" in cast_method
          assert "CurrentMana -= spell.manaCost" not in cast_method
          assert "cooldownUntil[spell.element] = Time.time + spell.cooldown;" in spell_combat
          assert "TryCast(\"fire\")" in input_router
          assert "magic.AddBinding(\"<Keyboard>/k\")" in input_router
          health_source = (root / "Assets/Scripts/Combat/AstreaHealth.cs").read_text()
          assert "ApplyShield" in health_source and "shieldRemaining" in health_source
          cloud_build = (root / "Assets/Editor/AstreaCloudBuild.cs").read_text()
          assert "GenerateStarterAssets" in cloud_build and "BuildPipeline.BuildPlayer" in cloud_build
          assert "ASTREA_Humanoid_Meshy6.fbx" in cloud_build
          assert "binder.RequestMagic" in scene_builder
          assert "TryAttack()" in combat and "AnimationEvent_ApplyMeleeHit" in combat
          assert "OverlapSphereNonAlloc" in combat, "Melee query must avoid per-swing allocations"
          assert "ResolveMeleeHitFallback" in combat and "fallbackImpactDelay" in combat
          assert "hitResolvedThisSwing" in combat, "One swing must resolve its hit only once"
          assert "RaycastNonAlloc" in combat and "HasLineOfSight" in combat, "Melee hits must respect obstacles"
          health = (root / "Assets/Scripts/Combat/AstreaHealth.cs").read_text()
          assert "IAstreaDamageable" in health and "HealthChanged" in health
          scene_builder = (root / "Assets/Editor/AstreaStarterSceneBuilder.cs").read_text()
          assert "ASTREA_Humanoid_Meshy6.fbx" in scene_builder
          assert "AstreaCombatController" in scene_builder and "RequestAttack" in scene_builder
          mixamo = (root / "Assets/Editor/AstreaMixamoImportPostprocessor.cs").read_text()
          assert "ModelImporterAnimationType.Human" in mixamo
          assert "ModelImporterAvatarSetup.CopyFromOther" in mixamo
          assert "ASTREA_Humanoid_Meshy6.fbx" in mixamo
          input_router = (root / "Assets/Scripts/Input/AstreaInputRouter.cs").read_text()
          for binding in ["<Keyboard>/w", "<Mouse>/delta", "<Gamepad>/leftStick", "<Gamepad>/rightStick", "<Gamepad>/buttonSouth"]:
              assert binding in input_router, binding
          assert "SetDeviceMove" in input_router and "SetDeviceLook" in input_router
          assert "sprint.AddBinding(\"<Keyboard>/leftShift\")" in input_router
          assert "SetSprintHeld(sprint.IsPressed())" in input_router
          movement = (root / "Assets/Scripts/Character/AstreaThirdPersonController.cs").read_text()
          for contract in ["UpdateLook()", "Vector3.ClampMagnitude", "IsSprinting", "SetSprintHeld", "RequestJump", "OnDisable()"]:
              assert contract in movement, contract
          hold_button = (root / "Assets/Scripts/UI/AstreaHoldButton.cs").read_text()
          assert "IPointerDownHandler" in hold_button and "IPointerUpHandler" in hold_button
          assert "SetSprintHeld(true)" in hold_button and "SetSprintHeld(false)" in hold_button
          assert "Sprint Button" in scene_builder and "SetInputBinder(binder)" in scene_builder
          assert "AstreaSpellCombatController" in input_router
          addressables = (root / "Assets/Scripts/Content/AstreaAddressableLoader.cs").read_text()
          assert "Addressables.InstantiateAsync" in addressables
          assert "Addressables.ReleaseInstance" in addressables
          vfx = (root / "Assets/Scripts/VFX/AstreaVfxLibrary.cs").read_text()
          assert "StartCoroutine(ReturnWhenFinished" in vfx and "maxPerEffect" in vfx
          assert "instanceCounts[key] < maxPerEffect" in vfx
          assert "return false; // Respect the per-effect cap" in vfx
          assert "instanceCounts[key]++" in vfx and "instanceCounts[key] - 1" in vfx
          combat = (root / "Assets/Scripts/Combat/AstreaCombatController.cs").read_text()
          assert "impactVfxKey" in combat and "vfxLibrary.Play" in combat
          animation = (root / "Assets/Scripts/Animation/AstreaAnimationDriver.cs").read_text()
          for parameter in ["Speed", "Grounded", "VerticalSpeed", "Attack", "Hit", "Dead"]:
              assert parameter in animation, parameter
          assert "PlanarVelocity" in animation and "PlayDeath" in animation
          vfx_setup = (root / "Assets/Editor/AstreaVfxSetup.cs").read_text()
          for effect in ["melee_impact", "fire_burst", "water_burst", "wind_burst", "earth_burst", "frost_burst", "lightning_burst", "nature_burst", "light_burst", "dark_burst"]:
              assert effect in vfx_setup, effect
          spell_vfx = (root / "Assets/Scripts/VFX/AstreaSpellVfxController.cs").read_text()
          for element in ["fire_burst", "water_burst", "wind_burst", "earth_burst", "frost_burst", "lightning_burst", "nature_burst", "light_burst", "dark_burst"]:
              assert element in spell_vfx, element
          animator_setup = (root / "Assets/Editor/AstreaAnimatorSetup.cs").read_text()
          for parameter in ["Speed", "Grounded", "VerticalSpeed", "Attack", "Hit", "Dead"]:
              assert parameter in animator_setup, parameter
          animator_setup = (root / "Assets/Editor/AstreaAnimatorSetup.cs").read_text()
          assert "foreach (var animator in UnityEngine.Object.FindObjectsByType<Animator>(FindObjectsSortMode.None))" in animator_setup
          assert "animator.runtimeAnimatorController = controller;" in animator_setup
          assert "animator.applyRootMotion = false;" in animator_setup
          assert "EditorUtility.SetDirty(animator);" in animator_setup
          assert "AssignToSceneAnimators(controller);" in animator_setup
          assert "CinemachineBrain" in scene_builder and "CinemachineFollow" in scene_builder

          for workflow_name in ["unity-linux-server-build.yml", "unity-fishnet-two-client-integration.yml"]:
              workflow_text = (Path(".github/workflows") / workflow_name).read_text()
              for secret_name in ["UNITY_LICENSE", "UNITY_EMAIL", "UNITY_PASSWORD"]:
                  assert "secrets." + secret_name in workflow_text, (workflow_name, secret_name)
          fishnet_workflow = (Path(".github/workflows") / "unity-fishnet-two-client-integration.yml").read_text()
          assert "confirm_build" in fishnet_workflow and "confirm_build == 'yes'" in fishnet_workflow
          assert "ASTREA_FISHNET_TEST_RESULT=CLIENT_2_OBSERVED_REMOTE_SERVER_MOVEMENT" in fishnet_workflow

          importer_workflow = Path(".github/workflows/meshy-import-existing-artifact.yml").read_text()
          assert "actions/download-artifact@v4" in importer_workflow
          assert "ASTREA-Humanoid-Meshy6" in importer_workflow
          assert "run-id: 43717997465" in importer_workflow
          assert "assimp export" in importer_workflow
          assert "ASTREA_Humanoid_Meshy6.fbx" in importer_workflow
          assert "contents: write" in importer_workflow
          assert "MESHY_API_KEY" not in importer_workflow, "Artifact import must not call Meshy or consume credits."

          print("Unity 6.3 URP project metadata and source layout validated.")
          print("No Unity Gaming Services package or billing integration is configured.")
          PY
