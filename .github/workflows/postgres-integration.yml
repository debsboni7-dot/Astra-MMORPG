name: ASTREA PostgreSQL integration

on:
  push:
    branches:
      - spike/fishnet-unity-6-3-evaluation
    paths:
      - 'server/**'
      - 'tests/postgres-integration.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/postgres-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - 'tests/postgres-integration.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/postgres-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astrea-postgres-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astrea
          POSTGRES_PASSWORD: astrea-ci-only
          POSTGRES_DB: astrea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astrea -d astrea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://astrea:astrea-ci-only@127.0.0.1:5432/astrea_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: node scripts/apply-server-migrations.js
      - name: Verify real PostgreSQL persistence and recovery
        run: node --test tests/postgres-integration.test.js
