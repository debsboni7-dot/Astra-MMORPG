name: ASTREA Unity 6.3 Linux Dedicated Server build

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "Run licensed Unity Editor compilation and Linux Dedicated Server build"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

jobs:
  build-linux-server:
    if: inputs.confirm_build == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check Unity license secret
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=()
          [[ -n "${UNITY_LICENSE:-}" ]] || missing+=("UNITY_LICENSE")
          [[ -n "${UNITY_EMAIL:-}" ]] || missing+=("UNITY_EMAIL")
          [[ -n "${UNITY_PASSWORD:-}" ]] || missing+=("UNITY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}. Add the Unity Personal license file and Unity account credentials before running this workflow."
            exit 1
          fi

      - name: Build ASTREA Linux Dedicated Server with Unity Editor
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.3.28f1
          targetPlatform: StandaloneLinux64
          buildMethod: Astrea.EditorTools.AstreaCloudBuild.BuildLinuxDedicatedServer
          allowDirtyBuild: true
          customParameters: -batchmode -nographics

      - name: Upload Linux Dedicated Server
        uses: actions/upload-artifact@v4
        with:
          name: ASTREA-Linux-Dedicated-Server
          path: unity/Build/ASTREA-LinuxServer/
          if-no-files-found: error
          retention-days: 14
