name: ASTREA starter world environment build

concurrency:
  group: astrea-art-build-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [feat/blender-unreal-cloud-pipeline]
    paths:
      - "blender-workbench/build_world_environment.py"
      - ".github/workflows/blender-world-build.yml"

permissions:
  contents: write

jobs:
  world-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libxkbcommon0 python3-numpy assimp-utils
          blender --version
      - name: Generate Astrea starter plains environment
        env:
          ASTREA_WORLD_OUTPUT_DIR: ${{ github.workspace }}/build/astrea-world
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          mkdir -p "$ASTREA_WORLD_OUTPUT_DIR"
          blender -b --python blender-workbench/build_world_environment.py
      - name: Convert environment GLB to Unity FBX
        run: |
          assimp export build/astrea-world/astrea-starter-plains.glb build/astrea-world/astrea-starter-plains.fbx -f fbx
          assimp info build/astrea-world/astrea-starter-plains.fbx
          python3 - <<'PY'
          import json
          p="build/astrea-world/build-report.json"
          d=json.load(open(p))
          if "fbx" not in d["formats"]: d["formats"].append("fbx")
          d["unity_asset"]="ASTREA_Starter_Plains.fbx"
          json.dump(d,open(p,"w"),indent=2)
          PY
      - name: Validate environment deliverables
        run: |
          test -s build/astrea-world/astrea-starter-plains.blend
          test -s build/astrea-world/astrea-starter-plains.glb
          test -s build/astrea-world/astrea-starter-plains.fbx
          test -s build/astrea-world/astrea-starter-plains-preview.png
          python3 - <<'PY'
          import json
          p=json.load(open("build/astrea-world/build-report.json"))
          assert p["tree_count"] >= 35, p
          assert p["boulder_count"] >= 65, p
          assert p["grass_blade_count"] >= 7000, p
          assert p["terrain_vertices"] > 5000, p
          assert 5 <= p["environment_objects"] <= 60, p
          print("Validated ASTREA terrain and environment geometry:", p)
          PY
      - name: Integrate world asset into Unity
        run: |
          mkdir -p unity/Assets/Art/Environment/Astrea
          cp build/astrea-world/astrea-starter-plains.fbx unity/Assets/Art/Environment/Astrea/ASTREA_Starter_Plains.fbx
          cp build/astrea-world/astrea-starter-plains-preview.png unity/Assets/Art/Environment/Astrea/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unity/Assets/Art/Environment/Astrea/
          if ! git diff --cached --quiet; then
            git commit -m "Add generated ASTREA starter plains environment"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: astrea-starter-plains-${{ github.run_number }}
          path: build/astrea-world/
          retention-days: 14
