<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#10151b">
  <title>Astra MMORPG — Prototype moteur maison</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game">
    <canvas id="viewport" aria-label="Vue 3D du prototype Astra"></canvas>
    <div class="hud">
      <div class="brand">ASTRA <span>MMORPG</span></div>
      <div class="status"><i></i> Prototype moteur maison · WebGL 2</div>
      <div class="help" id="help">Déplacement : ZQSD / WASD · Caméra : souris ou flèches</div>
    </div>
    <div class="mobile-controls" aria-label="Commandes tactiles">
      <div class="stick" id="stick"><div class="stick-knob" id="stick-knob"></div></div>
      <button id="run" type="button">COURIR</button>
    </div>
    <div class="loading" id="loading">Initialisation du moteur…</div>
    <div class="error" id="error" hidden></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
