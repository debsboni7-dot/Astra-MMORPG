<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTREA Combat Engine Tests</title>
<style>body{font:16px system-ui;background:#101722;color:#e9eef7;padding:24px;max-width:900px;margin:auto}h1{color:#8bcfff}li{padding:7px 0}.pass{color:#7ee0a2}.fail{color:#ff8585}code{color:#b9dfff}</style>
<h1>ASTREA — Tests du moteur de combat</h1><p>Tests unitaires autonomes du noyau de calcul. Les coefficients utilisés ici sont des fixtures de test, pas des valeurs de gameplay validées.</p><ol id="results"></ol><p id="summary"></p>
<script type="module">
import * as C from './src/combat/CombatEngine.js';
const results=document.querySelector('#results');let passed=0,failed=0;
function test(name,fn){const li=document.createElement('li');try{fn();li.textContent='✓ '+name;li.className='pass';passed++;}catch(e){li.textContent='✗ '+name+' — '+e.message;li.className='fail';failed++;}results.append(li)}
function eq(a,b){if(Math.abs(a-b)>1e-8)throw new Error('attendu '+b+', obtenu '+a)}
function ok(v){if(!v)throw new Error('condition non satisfaite')}
test('défense élevée réduit les dégâts sans annuler automatiquement',()=>{const a=C.calculatePhysicalDamage({base:100,defense:100,balance:{defenseK:100},rng:()=>1});eq(a.damage,50);});
test('résistance élémentaire réduit les dégâts',()=>{const a=C.calculateMagicDamage({base:100,resistance:.25,rng:()=>1});eq(a.damage,75);});
test('faiblesse augmente les dégâts',()=>{const a=C.calculateMagicDamage({base:100,resistance:-.5,rng:()=>1});eq(a.damage,150);});
test('coup critique dépend du tirage',()=>{ok(C.calculateCritical({chance:1,rng:()=>0}).critical);ok(!C.calculateCritical({chance:0,rng:()=>0}).critical);});
test('bouclier absorbe avant les PV',()=>{const t={hp:100};const s=C.createShield({id:'s',capacity:30});const r=C.applyDamage(t,50,{shields:[s]});eq(r.hpLost,20);eq(s.remaining,0);});
test('soin plafonné aux PV maximums',()=>{const t={hp:90,maxHp:100};eq(C.applyHealing(t,50).restored,10);eq(t.hp,100);});
test('réapplication brûlure prolonge la durée sans augmenter intensité',()=>{const t={statusEffects:[]};C.applyStatus(t,{id:'burn',durationMs:5000,intensity:2,reapplyPolicy:'extend-duration'},1000);const r=C.applyStatus(t,{id:'burn',durationMs:3000,intensity:9,reapplyPolicy:'extend-duration'},2000);eq(r.effect.intensity,2);eq(r.effect.expiresAt,9000);});
test('les dégâts périodiques commencent au premier intervalle',()=>{const t={hp:100,statusEffects:[]};C.applyStatus(t,{id:'poison',category:'dot',durationMs:5000,intensity:1,tickDamage:4,tickIntervalMs:1000},0);eq(C.tickDamageOverTime(t,999).damage,0);eq(C.tickDamageOverTime(t,1000).damage,4);eq(t.hp,96);});
test('purification retire seulement les catégories ciblées',()=>{const t={statusEffects:[{id:'burn',category:'dot'},{id:'slow',category:'control'}]};eq(C.purifyStatuses(t,{categories:['dot']}).removed,1);eq(t.statusEffects[0].id,'slow');});
test('buffs de même groupe ne s additionnent pas',()=>{const t={modifiers:[]};C.applyModifier(t,{id:'a',stat:'strength',value:20,durationMs:10000},0);C.applyModifier(t,{id:'b',stat:'strength',value:35,durationMs:5000},0);eq(C.getModifiedStat(100,t.modifiers,'strength',1),135);});
test('absorption hostile autorisée uniquement pour feu et mastery strictement supérieure',()=>{ok(C.absorbAndIntensifyHostileAttack({element:'fire',defenderFireMastery:11,attackerFireMastery:10,incomingDamage:40}).absorbed);ok(!C.absorbAndIntensifyHostileAttack({element:'ice',defenderFireMastery:99,attackerFireMastery:1,incomingDamage:40}).absorbed);ok(!C.absorbAndIntensifyHostileAttack({element:'fire',defenderFireMastery:10,attackerFireMastery:10,incomingDamage:40}).absorbed);});
test('arme exige force et maîtrise simultanément',()=>{ok(!C.canUseWeapon({physicalStrength:100,requiredStrength:50,weaponMastery:2,requiredMastery:3}).canUse);ok(!C.canUseWeapon({physicalStrength:49,requiredStrength:50,weaponMastery:9,requiredMastery:3}).canUse);});
document.querySelector('#summary').textContent=passed+' réussis · '+failed+' échoués';document.querySelector('#summary').className=failed?'fail':'pass';
</script></html>
